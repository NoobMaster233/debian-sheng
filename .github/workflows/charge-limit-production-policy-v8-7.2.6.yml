name: Build sheng 7.2.6 s2idle UCSI wake candidate v19

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build pinned 7.2.6 s2idle UCSI wake candidate v19
    runs-on: ubuntu-24.04-arm
    container: debian:forky
    timeout-minutes: 180

    env:
      KERNEL_REPO: https://github.com/ianchb/sm8550-mainline.git
      KERNEL_BASE: 42f3b40c702abbc37c3a04c95af008cd283aeaf3
      KERNEL_RELEASE: 7.2.6-sm8550-00103-g42f3b40c702a
      PROBE_PATCH_V2: patches/qcom-battmgr-readonly-charge-probe-v2-7.2.6.patch
      POLICY_PATCH: patches/qcom-battmgr-sheng-charge-limit-v7-7.2.6.patch
      READ_FIX_PATCH: patches/qcom-battmgr-sheng-threshold-read-v8-7.2.6.patch
      UCSI_WAKE_PATCH: patches/ucsi-glink-wakeup-v19-7.2.6.patch
      BOOT_CMDLINE: root=PARTLABEL=linux module_blacklist=qcom_battmgr

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates git file xz-utils \
            build-essential flex bison libssl-dev libelf-dev bc \
            ccache clang llvm lld
          ccache --set-config=max_size=10G
          ccache --set-config=sloppiness=file_macro,locale,time_macros

      - name: Verify Debian 21.1.8 toolchain
        run: |
          clang --version | head -n 1 | tee clang-version.txt
          ld.lld --version | head -n 1 | tee lld-version.txt
          llvm-nm --version | head -n 1 | tee llvm-nm-version.txt
          grep -Fx 'Debian clang version 21.1.8 (10)' clang-version.txt
          grep -E '^Debian LLD 21\.1\.8( |$)' lld-version.txt

      - name: Checkout exact workflow revision
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: sleep-ucsi-v19-7.2.6-clang21-${{ hashFiles('sm8550.config', 'patches/qcom-battmgr-readonly-charge-probe-v2-7.2.6.patch', 'patches/qcom-battmgr-sheng-charge-limit-v7-7.2.6.patch', 'patches/qcom-battmgr-sheng-threshold-read-v8-7.2.6.patch', 'patches/ucsi-glink-wakeup-v19-7.2.6.patch') }}
          restore-keys: |
            sleep-ucsi-v19-7.2.6-clang21-
            charge-policy-v8-7.2.6-clang21-
            charge-policy-v7-7.2.6-clang21-
            charge-readonly-v2-7.2.6-clang21-
            charge-readonly-7.2.6-clang21-

      - name: Fetch exact kernel baseline
        run: |
          git init linux
          git -C linux remote add origin "$KERNEL_REPO"
          git -C linux fetch --depth 1 origin "$KERNEL_BASE"
          git -C linux checkout --detach FETCH_HEAD
          test "$(git -C linux rev-parse HEAD)" = "$KERNEL_BASE"

      - name: Apply and lint V8 plus upstream-posted UCSI wake fix
        run: |
          git -C linux apply --check "${GITHUB_WORKSPACE}/${PROBE_PATCH_V2}"
          git -C linux apply "${GITHUB_WORKSPACE}/${PROBE_PATCH_V2}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${POLICY_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${POLICY_PATCH}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${READ_FIX_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${READ_FIX_PATCH}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${UCSI_WAKE_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${UCSI_WAKE_PATCH}"
          git -C linux diff --check
          linux/scripts/checkpatch.pl --strict --no-tree --no-signoff \
            "${GITHUB_WORKSPACE}/${PROBE_PATCH_V2}" | tee checkpatch-v2.txt
          linux/scripts/checkpatch.pl --strict --no-tree --no-signoff \
            "${GITHUB_WORKSPACE}/${POLICY_PATCH}" | tee checkpatch-v7.txt
          linux/scripts/checkpatch.pl --strict --no-tree --no-signoff \
            "${GITHUB_WORKSPACE}/${READ_FIX_PATCH}" | tee checkpatch-v8.txt
          linux/scripts/checkpatch.pl --strict --no-tree --no-signoff \
            "${GITHUB_WORKSPACE}/${UCSI_WAKE_PATCH}" | tee checkpatch-v19.txt
          grep -q '0 errors, 0 warnings' checkpatch-v2.txt
          grep -q '0 errors, 0 warnings' checkpatch-v7.txt
          grep -q '0 errors, 0 warnings' checkpatch-v8.txt
          grep -q '0 errors, 0 warnings' checkpatch-v19.txt

      - name: Configure boot-only probe
        run: |
          cp sm8550.config linux/.config
          linux/scripts/config --file linux/.config --enable BATTERY_QCOM_BATTMGR
          linux/scripts/config --file linux/.config --disable LOCALVERSION_AUTO
          linux/scripts/config --file linux/.config \
            --set-str LOCALVERSION '-sm8550-00103-g42f3b40c702a'
          make -C linux ARCH=arm64 LLVM=1 LOCALVERSION= olddefconfig
          grep -qx 'CONFIG_BATTERY_QCOM_BATTMGR=y' linux/.config
          grep -qx 'CONFIG_UCSI_PMIC_GLINK=y' linux/.config
          grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' linux/.config
          grep -qx 'CONFIG_LOCALVERSION="-sm8550-00103-g42f3b40c702a"' linux/.config
          actual_release="$(make -s -C linux ARCH=arm64 LLVM=1 LOCALVERSION= kernelrelease)"
          echo "kernel_release=$actual_release"
          test "$actual_release" = "$KERNEL_RELEASE"

      - name: Build kernel
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          export PATH="/usr/lib/ccache:$PATH"
          make -C linux -j"$(nproc)" ARCH=arm64 LLVM=1 LOCALVERSION=
          test -s linux/arch/arm64/boot/Image.gz
          test -s linux/arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb
          test -s linux/System.map
          test -s linux/drivers/power/supply/qcom_battmgr.o
          test ! -e linux/drivers/power/supply/qcom_battmgr.ko
          grep -q ' qcom_battmgr_xiaomi_prop_show$' linux/System.map
          grep -q ' qcom_battmgr_driver$' linux/System.map
          llvm-nm -a linux/drivers/power/supply/qcom_battmgr.o | \
            grep -E 'probe_(night_charging|smart_batt|smart_chg|charging_suspend_battery|enable_charging|charge_control_limit|charge_control_limit_max|constant_charge_current)|charge_limit|input_suspend' \
            > qcom-battmgr-probe-symbols.txt
          test "$(wc -l < qcom-battmgr-probe-symbols.txt)" -ge 12
          test -s linux/drivers/usb/typec/ucsi/ucsi_glink.o
          llvm-nm -a linux/drivers/usb/typec/ucsi/ucsi_glink.o | \
            grep -E 'pmic_glink_ucsi_(callback|probe)|pm_wakeup_dev_event' \
            > ucsi-glink-symbols.txt
          grep -q ' U pm_wakeup_dev_event$' ucsi-glink-symbols.txt

      - name: Pack dual-boot boot image
        run: |
          cat linux/arch/arm64/boot/Image.gz \
              linux/arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb \
            > Image.gz-dtb_sheng
          chmod +x mkbootimg
          ./mkbootimg \
            --kernel Image.gz-dtb_sheng \
            --cmdline "$BOOT_CMDLINE" \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --tags_offset 0x01e00000 \
            --pagesize 4096 \
            --id \
            -o boot.img
          test "$(stat -c %s boot.img)" -lt 201326592
          test "$(dd if=boot.img bs=1 count=8 status=none)" = 'ANDROID!'

      - name: Record provenance and checksums
        run: |
          mkdir -p out
          cp boot.img Image.gz-dtb_sheng checkpatch-v2.txt checkpatch-v7.txt \
            checkpatch-v8.txt checkpatch-v19.txt \
            qcom-battmgr-probe-symbols.txt ucsi-glink-symbols.txt \
            clang-version.txt lld-version.txt llvm-nm-version.txt out/
          cp linux/.config out/kernel.config
          cp linux/System.map out/
          cp linux/arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb out/
          cp "$PROBE_PATCH_V2" out/
          cp "$POLICY_PATCH" out/
          cp "$READ_FIX_PATCH" out/
          cp "$UCSI_WAKE_PATCH" out/
          git -C linux diff > out/kernel.patch
          {
            echo "workflow_repository=${GITHUB_REPOSITORY}"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "kernel_repository=${KERNEL_REPO}"
            echo "kernel_base=${KERNEL_BASE}"
            echo "kernel_release=$(make -s -C linux ARCH=arm64 LLVM=1 LOCALVERSION= kernelrelease)"
            echo "boot_cmdline=${BOOT_CMDLINE}"
            echo "BATTERY_QCOM_BATTMGR=built-in"
            echo "external_qcom_battmgr=blacklisted by boot cmdline"
            echo "policy_version=v8"
            echo "policy_backend=xiaomi input_suspend 0x2a"
            echo "standard_abi=charge_control_start_threshold,charge_control_end_threshold"
            echo "disabled_tuple=0,100"
            echo "policy_poll_ms=15000"
            echo "policy_events=firmware notifications and service return"
            echo "policy_cleanup=clear input_suspend on remove/shutdown"
            echo "threshold_reads=local policy state; no unsupported firmware GET"
            echo "private_write_test_attributes=none"
            echo "sleep_fix_version=v19"
            echo "sleep_fix_scope=ucsi_glink notification wake hold only"
            echo "ucsi_wakeup_timeout_ms=50"
            echo "ucsi_patch_status=upstream-posted v2; not merged at build preparation time"
            echo "deployment=boot-only candidate; do not flash boot_b before runtime validation"
          } > out/PROVENANCE.txt
          {
            file boot.img
            stat -c 'boot_size=%s' boot.img
            stat -c 'kernel_payload_size=%s' Image.gz-dtb_sheng
            sha256sum boot.img Image.gz-dtb_sheng
          } > out/BOOT_INFO.txt
          (cd out && sha256sum \
            boot.img Image.gz-dtb_sheng sm8550-xiaomi-sheng.dtb \
            kernel.config kernel.patch \
            qcom-battmgr-readonly-charge-probe-v2-7.2.6.patch \
            qcom-battmgr-sheng-charge-limit-v7-7.2.6.patch \
            qcom-battmgr-sheng-threshold-read-v8-7.2.6.patch \
            ucsi-glink-wakeup-v19-7.2.6.patch \
            System.map qcom-battmgr-probe-symbols.txt ucsi-glink-symbols.txt \
            checkpatch-v2.txt checkpatch-v7.txt checkpatch-v8.txt checkpatch-v19.txt \
            clang-version.txt lld-version.txt llvm-nm-version.txt \
            PROVENANCE.txt BOOT_INFO.txt > SHA256SUMS)

      - name: Upload probe artifact
        uses: actions/upload-artifact@v7
        with:
          name: sheng-7.2.6-s2idle-ucsi-wake-v19
          path: out/
          retention-days: 14
          if-no-files-found: error
          compression-level: 1
