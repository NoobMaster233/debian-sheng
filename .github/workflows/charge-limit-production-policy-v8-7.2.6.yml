name: Build sheng 7.2.6 daily-sleep candidate v17

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build pinned 7.2.6 daily-sleep candidate v17
    runs-on: ubuntu-24.04-arm
    container: debian:forky
    timeout-minutes: 180

    env:
      KERNEL_REPO: https://github.com/ianchb/sm8550-mainline.git
      KERNEL_BASE: 42f3b40c702abbc37c3a04c95af008cd283aeaf3
      KERNEL_RELEASE: 7.2.6-sm8550-00103-g42f3b40c702a
      PROBE_PATCH_V2: patches/qcom-battmgr-readonly-charge-probe-v2-7.2.6.patch
      POLICY_PATCH: patches/qcom-battmgr-sheng-charge-limit-v7-7.2.6.patch
      READ_FIX_PATCH: patches/qcom-battmgr-sheng-threshold-read-v8-7.2.6.patch
      UART_SLEEP_PATCH: patches/qcom-geni-ack-suspended-irq-v10-7.2.6.patch
      PMIC_SLEEP_PATCH: patches/qcom-battmgr-suspend-notifications-v11-7.2.6.patch
      PM_WIRE_PATCH: patches/qcom-battmgr-wire-system-sleep-pm-v12-7.2.6.patch
      CHARGERPD_LOG_PATCH: patches/qcom-battmgr-pause-chargerpd-logging-v13-7.2.6.patch
      CHARGERPD_WIRE_PATCH: patches/qcom-battmgr-chargerpd-wire-format-v14-7.2.6.patch
      CHARGERPD_CHANNEL_PATCH: patches/pmic-glink-chargerpd-logs-channel-v15-7.2.6.patch
      CHARGERPD_RUNTIME_PATCH: patches/qcom-battmgr-disable-runtime-logs-v16-7.2.6.patch
      CHARGERPD_RETRY_PATCH: patches/qcom-battmgr-log-endpoint-retry-v17-7.2.6.patch
      BOOT_CMDLINE: root=PARTLABEL=linux module_blacklist=qcom_battmgr

    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates git file xz-utils \
            build-essential flex bison libssl-dev libelf-dev bc \
            ccache clang llvm lld
          ccache --set-config=max_size=10G
          ccache --set-config=sloppiness=file_macro,locale,time_macros

      - name: Verify Debian 21.1.8 toolchain
        run: |
          clang --version | head -n 1 | tee clang-version.txt
          ld.lld --version | head -n 1 | tee lld-version.txt
          llvm-nm --version | head -n 1 | tee llvm-nm-version.txt
          grep -Fx 'Debian clang version 21.1.8 (10)' clang-version.txt
          grep -E '^Debian LLD 21\.1\.8( |$)' lld-version.txt

      - name: Checkout exact workflow revision
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: daily-sleep-v17-7.2.6-clang21-${{ hashFiles('sm8550.config', 'patches/qcom-battmgr-readonly-charge-probe-v2-7.2.6.patch', 'patches/qcom-battmgr-sheng-charge-limit-v7-7.2.6.patch', 'patches/qcom-battmgr-sheng-threshold-read-v8-7.2.6.patch', 'patches/qcom-geni-ack-suspended-irq-v10-7.2.6.patch', 'patches/qcom-battmgr-suspend-notifications-v11-7.2.6.patch', 'patches/qcom-battmgr-wire-system-sleep-pm-v12-7.2.6.patch', 'patches/qcom-battmgr-pause-chargerpd-logging-v13-7.2.6.patch', 'patches/qcom-battmgr-chargerpd-wire-format-v14-7.2.6.patch', 'patches/pmic-glink-chargerpd-logs-channel-v15-7.2.6.patch', 'patches/qcom-battmgr-disable-runtime-logs-v16-7.2.6.patch', 'patches/qcom-battmgr-log-endpoint-retry-v17-7.2.6.patch') }}
          restore-keys: |
            daily-sleep-v16-7.2.6-clang21-
            daily-sleep-v15-7.2.6-clang21-
            daily-sleep-v14-7.2.6-clang21-
            daily-sleep-v13-7.2.6-clang21-
            daily-sleep-v12-7.2.6-clang21-
            daily-sleep-v11-7.2.6-clang21-
            daily-sleep-v10-7.2.6-clang21-
            charge-policy-v9-7.2.6-clang21-
            charge-policy-v8-7.2.6-clang21-

      - name: Fetch exact kernel baseline
        run: |
          git init linux
          git -C linux remote add origin "$KERNEL_REPO"
          git -C linux fetch --depth 1 origin "$KERNEL_BASE"
          git -C linux checkout --detach FETCH_HEAD
          test "$(git -C linux rev-parse HEAD)" = "$KERNEL_BASE"

      - name: Apply and lint production policy
        run: |
          git -C linux apply --check "${GITHUB_WORKSPACE}/${PROBE_PATCH_V2}"
          git -C linux apply "${GITHUB_WORKSPACE}/${PROBE_PATCH_V2}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${POLICY_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${POLICY_PATCH}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${READ_FIX_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${READ_FIX_PATCH}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${UART_SLEEP_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${UART_SLEEP_PATCH}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${PMIC_SLEEP_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${PMIC_SLEEP_PATCH}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${PM_WIRE_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${PM_WIRE_PATCH}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${CHARGERPD_LOG_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${CHARGERPD_LOG_PATCH}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${CHARGERPD_WIRE_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${CHARGERPD_WIRE_PATCH}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${CHARGERPD_CHANNEL_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${CHARGERPD_CHANNEL_PATCH}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${CHARGERPD_RUNTIME_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${CHARGERPD_RUNTIME_PATCH}"
          git -C linux apply --check "${GITHUB_WORKSPACE}/${CHARGERPD_RETRY_PATCH}"
          git -C linux apply "${GITHUB_WORKSPACE}/${CHARGERPD_RETRY_PATCH}"
          git -C linux diff --check
          linux/scripts/checkpatch.pl --strict --no-tree --no-signoff \
            "${GITHUB_WORKSPACE}/${PROBE_PATCH_V2}" | tee checkpatch-v2.txt
          linux/scripts/checkpatch.pl --strict --no-tree --no-signoff \
            "${GITHUB_WORKSPACE}/${POLICY_PATCH}" | tee checkpatch-v7.txt
          linux/scripts/checkpatch.pl --strict --no-tree --no-signoff \
            "${GITHUB_WORKSPACE}/${READ_FIX_PATCH}" | tee checkpatch-v8.txt
          linux/scripts/checkpatch.pl --strict --no-tree \
            "${GITHUB_WORKSPACE}/${UART_SLEEP_PATCH}" | tee checkpatch-v10-uart.txt
          linux/scripts/checkpatch.pl --strict --no-tree --no-signoff \
            "${GITHUB_WORKSPACE}/${PMIC_SLEEP_PATCH}" | tee checkpatch-v11-pmic.txt
          linux/scripts/checkpatch.pl --strict --no-tree --no-signoff \
            "${GITHUB_WORKSPACE}/${PM_WIRE_PATCH}" | tee checkpatch-v12-pm-wire.txt
          linux/scripts/checkpatch.pl --strict --no-tree \
            "${GITHUB_WORKSPACE}/${CHARGERPD_LOG_PATCH}" | tee checkpatch-v13-chargerpd-log.txt
          linux/scripts/checkpatch.pl --strict --no-tree \
            "${GITHUB_WORKSPACE}/${CHARGERPD_WIRE_PATCH}" | tee checkpatch-v14-chargerpd-wire.txt
          linux/scripts/checkpatch.pl --strict --no-tree \
            "${GITHUB_WORKSPACE}/${CHARGERPD_CHANNEL_PATCH}" | tee checkpatch-v15-chargerpd-channel.txt
          linux/scripts/checkpatch.pl --strict --no-tree \
            "${GITHUB_WORKSPACE}/${CHARGERPD_RUNTIME_PATCH}" | tee checkpatch-v16-chargerpd-runtime.txt
          linux/scripts/checkpatch.pl --strict --no-tree \
            "${GITHUB_WORKSPACE}/${CHARGERPD_RETRY_PATCH}" | tee checkpatch-v17-chargerpd-retry.txt
          grep -q '0 errors, 0 warnings' checkpatch-v2.txt
          grep -q '0 errors, 0 warnings' checkpatch-v7.txt
          grep -q '0 errors, 0 warnings' checkpatch-v8.txt
          grep -q '0 errors, 0 warnings' checkpatch-v10-uart.txt
          grep -q '0 errors, 0 warnings' checkpatch-v11-pmic.txt
          grep -q '0 errors, 0 warnings' checkpatch-v12-pm-wire.txt
          grep -q '0 errors, 0 warnings' checkpatch-v13-chargerpd-log.txt
          grep -q '0 errors, 0 warnings' checkpatch-v14-chargerpd-wire.txt
          grep -q '0 errors, 0 warnings' checkpatch-v15-chargerpd-channel.txt
          grep -q '0 errors, 0 warnings' checkpatch-v16-chargerpd-runtime.txt
          grep -q '0 errors, 0 warnings' checkpatch-v17-chargerpd-retry.txt

      - name: Configure production kernel
        run: |
          cp sm8550.config linux/.config
          linux/scripts/config --file linux/.config --enable BATTERY_QCOM_BATTMGR
          linux/scripts/config --file linux/.config --disable LOCALVERSION_AUTO
          linux/scripts/config --file linux/.config \
            --set-str LOCALVERSION '-sm8550-00103-g42f3b40c702a'
          make -C linux ARCH=arm64 LLVM=1 LOCALVERSION= olddefconfig
          grep -qx 'CONFIG_BATTERY_QCOM_BATTMGR=y' linux/.config
          grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' linux/.config
          grep -qx 'CONFIG_LOCALVERSION="-sm8550-00103-g42f3b40c702a"' linux/.config
          actual_release="$(make -s -C linux ARCH=arm64 LLVM=1 LOCALVERSION= kernelrelease)"
          echo "kernel_release=$actual_release"
          test "$actual_release" = "$KERNEL_RELEASE"

      - name: Build kernel
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          export PATH="/usr/lib/ccache:$PATH"
          make -C linux -j"$(nproc)" ARCH=arm64 LLVM=1 LOCALVERSION=
          test -s linux/arch/arm64/boot/Image.gz
          test -s linux/arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb
          test -s linux/System.map
          test -s linux/drivers/power/supply/qcom_battmgr.o
          test -s linux/drivers/tty/serial/qcom_geni_serial.o
          test -s linux/drivers/soc/qcom/pmic_glink.o
          test ! -e linux/drivers/power/supply/qcom_battmgr.ko
          grep -q ' qcom_battmgr_xiaomi_prop_show$' linux/System.map
          grep -q ' qcom_battmgr_driver$' linux/System.map
          grep -q ' qcom_geni_serial_suspend$' linux/System.map
          grep -q ' qcom_geni_serial_resume$' linux/System.map
          grep -q ' qcom_battmgr_pm_ops$' linux/System.map
          grep -q ' pmic_glink_log_send$' linux/System.map
          grep -q ' qcom_battmgr_log_disable_worker$' linux/System.map
          strings linux/vmlinux | grep -qF 'PMIC_LOGS_ADSP_APPS'
          strings linux/vmlinux | grep -qF 'failed to disable chargerpd logging'
          strings linux/vmlinux | \
            grep -qF 'failed to restore chargerpd logging while stopping'
          llvm-nm -a linux/drivers/power/supply/qcom_battmgr.o | \
            grep -E 'probe_(night_charging|smart_batt|smart_chg|charging_suspend_battery|enable_charging|charge_control_limit|charge_control_limit_max|constant_charge_current)|charge_limit|input_suspend' \
            > qcom-battmgr-probe-symbols.txt
          test "$(wc -l < qcom-battmgr-probe-symbols.txt)" -ge 12

      - name: Pack dual-boot boot image
        run: |
          cat linux/arch/arm64/boot/Image.gz \
              linux/arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb \
            > Image.gz-dtb_sheng
          chmod +x mkbootimg
          ./mkbootimg \
            --kernel Image.gz-dtb_sheng \
            --cmdline "$BOOT_CMDLINE" \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --tags_offset 0x01e00000 \
            --pagesize 4096 \
            --id \
            -o boot.img
          test "$(stat -c %s boot.img)" -lt 201326592
          test "$(dd if=boot.img bs=1 count=8 status=none)" = 'ANDROID!'

      - name: Record provenance and checksums
        run: |
          mkdir -p out
          cp boot.img Image.gz-dtb_sheng checkpatch-v2.txt checkpatch-v7.txt \
            checkpatch-v8.txt checkpatch-v10-uart.txt checkpatch-v11-pmic.txt \
            checkpatch-v12-pm-wire.txt checkpatch-v13-chargerpd-log.txt \
            checkpatch-v14-chargerpd-wire.txt \
            checkpatch-v15-chargerpd-channel.txt \
            checkpatch-v16-chargerpd-runtime.txt \
            checkpatch-v17-chargerpd-retry.txt \
            qcom-battmgr-probe-symbols.txt \
            clang-version.txt lld-version.txt llvm-nm-version.txt out/
          cp linux/.config out/kernel.config
          cp linux/System.map out/
          cp linux/arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb out/
          cp "$PROBE_PATCH_V2" out/
          cp "$POLICY_PATCH" out/
          cp "$READ_FIX_PATCH" out/
          cp "$UART_SLEEP_PATCH" out/
          cp "$PMIC_SLEEP_PATCH" out/
          cp "$PM_WIRE_PATCH" out/
          cp "$CHARGERPD_LOG_PATCH" out/
          cp "$CHARGERPD_WIRE_PATCH" out/
          cp "$CHARGERPD_CHANNEL_PATCH" out/
          cp "$CHARGERPD_RUNTIME_PATCH" out/
          cp "$CHARGERPD_RETRY_PATCH" out/
          git -C linux diff > out/kernel.patch
          {
            echo "workflow_repository=${GITHUB_REPOSITORY}"
            echo "workflow_commit=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "kernel_repository=${KERNEL_REPO}"
            echo "kernel_base=${KERNEL_BASE}"
            echo "kernel_release=$(make -s -C linux ARCH=arm64 LLVM=1 LOCALVERSION= kernelrelease)"
            echo "boot_cmdline=${BOOT_CMDLINE}"
            echo "BATTERY_QCOM_BATTMGR=built-in"
            echo "external_qcom_battmgr=blacklisted by boot cmdline"
            echo "policy_version=v17"
            echo "policy_backend=xiaomi input_suspend 0x2a"
            echo "standard_abi=charge_control_start_threshold,charge_control_end_threshold"
            echo "disabled_tuple=0,100"
            echo "policy_poll_ms=15000"
            echo "policy_events=firmware notifications and service return"
            echo "policy_cleanup=clear input_suspend on remove/shutdown"
            echo "threshold_reads=local policy state; no unsupported firmware GET"
            echo "private_write_test_attributes=none"
            echo "uart_sleep_fix=acknowledge latched GENI IRQ status while uart_port is suspended before shutdown masks the IRQ"
            echo "uart_sleep_scope=preserves v8 runtime PM and UFS power path; does not include rejected d0cd9c8d force-suspend backport"
            echo "pmic_sleep_fix=send Xiaomi downstream notification disable opcode 0x05 on system suspend and re-enable opcode 0x04 on resume"
            echo "pmic_sleep_evidence=XM_PROP_CHG_DEBUG property 75, 220-byte chg_debug_msg, CHG_ADSP_LOG type 1"
            echo "pmic_sleep_scope=XIAOMI_BATTMGR_SM8550 only; disable failure does not block suspend"
            echo "pmic_sleep_wiring=standard dev_pm_ops on embedded auxiliary device_driver.pm"
            echo "pmic_sleep_v11_result=legacy auxiliary_driver suspend/resume fields were not wired by this kernel auxiliary bus"
            echo "chargerpd_log_protocol=owner 32778, req-resp opcode 0x19, little-endian u64 categories plus u32 level"
            echo "chargerpd_log_source=xiaomi-sheng QcomChargerCfg and Qualcomm downstream qti_battery_debug"
            echo "chargerpd_log_active=categories 0xe00008000, level 4"
            echo "chargerpd_log_suspend=categories 0, level 0; exact active values restored on resume"
            echo "chargerpd_log_scope=XIAOMI_BATTMGR_SM8550 only; failures warn and do not abort PM"
            echo "chargerpd_log_wire=exact 24 bytes: header plus categories low/high u32 plus level u32"
            echo "chargerpd_log_response=validated 16-byte generic response; owner 32778 or 32781"
            echo "chargerpd_log_v13_result=32-byte host-ABI padded request timed out on suspend and resume"
            echo "chargerpd_log_v14_result=exact 24-byte request still timed out on the PMIC_RTR endpoint"
            echo "chargerpd_log_channel=PMIC_LOGS_ADSP_APPS dedicated RPMSG endpoint"
            echo "chargerpd_log_transport=separate pmic_glink log endpoint; ordinary traffic stays on PMIC_RTR"
            echo "chargerpd_log_v15_result=opcode 0x19 accepted, but one line queued 226 ms before suspend still woke APSS"
            echo "chargerpd_log_runtime=disabled at service-up and after resume; not toggled at suspend boundary"
            echo "chargerpd_log_cleanup=restore exact sheng firmware categories and level on remove or shutdown"
            echo "chargerpd_log_v16_result=first disable raced log endpoint binding and returned -ECONNRESET"
            echo "chargerpd_log_retry=250 ms bounded retry for at most 10 seconds, plus one suspend fallback"
            echo "chargerpd_log_state=remember disabled state and avoid normal suspend/resume toggles"
          } > out/PROVENANCE.txt
          {
            file boot.img
            stat -c 'boot_size=%s' boot.img
            stat -c 'kernel_payload_size=%s' Image.gz-dtb_sheng
            sha256sum boot.img Image.gz-dtb_sheng
          } > out/BOOT_INFO.txt
          (cd out && sha256sum \
            boot.img Image.gz-dtb_sheng sm8550-xiaomi-sheng.dtb \
            kernel.config kernel.patch \
            qcom-battmgr-readonly-charge-probe-v2-7.2.6.patch \
            qcom-battmgr-sheng-charge-limit-v7-7.2.6.patch \
            qcom-battmgr-sheng-threshold-read-v8-7.2.6.patch \
            qcom-geni-ack-suspended-irq-v10-7.2.6.patch \
            qcom-battmgr-suspend-notifications-v11-7.2.6.patch \
            qcom-battmgr-wire-system-sleep-pm-v12-7.2.6.patch \
            qcom-battmgr-pause-chargerpd-logging-v13-7.2.6.patch \
            qcom-battmgr-chargerpd-wire-format-v14-7.2.6.patch \
            pmic-glink-chargerpd-logs-channel-v15-7.2.6.patch \
            qcom-battmgr-disable-runtime-logs-v16-7.2.6.patch \
            qcom-battmgr-log-endpoint-retry-v17-7.2.6.patch \
            System.map qcom-battmgr-probe-symbols.txt \
            checkpatch-v2.txt checkpatch-v7.txt checkpatch-v8.txt \
            checkpatch-v10-uart.txt checkpatch-v11-pmic.txt \
            checkpatch-v12-pm-wire.txt \
            checkpatch-v13-chargerpd-log.txt \
            checkpatch-v14-chargerpd-wire.txt \
            checkpatch-v15-chargerpd-channel.txt \
            checkpatch-v16-chargerpd-runtime.txt \
            checkpatch-v17-chargerpd-retry.txt \
            clang-version.txt lld-version.txt llvm-nm-version.txt \
            PROVENANCE.txt BOOT_INFO.txt > SHA256SUMS)

      - name: Upload production artifact
        uses: actions/upload-artifact@v7
        with:
          name: sheng-7.2.6-daily-sleep-v17-log-retry
          path: out/
          retention-days: 14
          if-no-files-found: error
          compression-level: 1
